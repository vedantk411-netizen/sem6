<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | CyberFocus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-logo">CYBER<span style="color: var(--primary-color);">FOCUS</span></div>
        <div>
            <a href="/dashboard.html" class="nav-btn" style="margin-right: 10px; text-decoration: none;">Dashboard</a>
            <button class="nav-btn" onclick="logout()">LOGOUT</button>
        </div>
    </nav>

    <!-- Portfolio Container -->
    <div class="dashboard-container">
        <div class="section-header">
            <h2>Featured Works</h2>
            <p style="color: var(--text-muted);">A collection of our finest cyber-aesthetic shots.</p>
        </div>

        <!-- Portfolio Grid -->
        <div class="shoot-grid" id="portfolio-grid">
            <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Loading portfolio items...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
