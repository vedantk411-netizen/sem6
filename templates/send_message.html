<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message | ITS_CAPTURED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }

        .message-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        .message-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .message-header h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 2em;
        }

        .message-header p {
            color: #999;
            margin: 0;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
        }

        .btn-back:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 25px;
            font-size: 0.9em;
            color: #555;
        }

        @media (max-width: 600px) {
            .message-container {
                padding: 25px;
            }

            .message-header h1 {
                font-size: 1.5em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="message-container">
        <div class="message-header">
            <h1><i class="fas fa-envelope"></i> Send Message</h1>
            <p>Share your thoughts, questions, or concerns with our admin team</p>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i> Your message will be reviewed by our admin team and we'll get back to you soon.
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> Message sent successfully! Our team will respond soon.
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Sending your message...</p>
        </div>

        <form id="messageForm" style="display: block;">
            <div class="form-group">
                <label for="subject">Subject *</label>
                <input type="text" id="subject" placeholder="e.g., Help with lighting setup" required>
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" placeholder="Write your message here... Tell us what you need help with or any feedback you have." required></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-send">
                    <i class="fas fa-paper-plane"></i> Send Message
                </button>
                <button type="button" class="btn btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
            </div>
        </form>
    </div>

    <script>
        const messageForm = document.getElementById('messageForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!subject || !message) {
                showError('Please fill in all fields');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            messageForm.style.display = 'none';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const response = await fetch('/api/chat-requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, message })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success
                    loading.style.display = 'none';
                    successMessage.style.display = 'block';
                    messageForm.reset();

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/profile';
                    }, 2000);
                } else {
                    showError(data.error || 'Failed to send message');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Server error. Please try again.');
            }
        });

        function showError(message) {
            loading.style.display = 'none';
            messageForm.style.display = 'block';
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function goBack() {
            window.location.href = '/profile';
        }
    </script>
</body>
</html>
