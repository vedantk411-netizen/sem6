<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | ITS_CAPTURED</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap for grid layout (optional, but helps with cards) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #fff; }
        .navbar { background-color: #000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .section-title { border-bottom: 2px solid #f1c40f; padding-bottom: 10px; margin-bottom: 20px; margin-top: 30px; }
        .rule-card { background: #333; border-left: 4px solid #f1c40f; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .pose-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; transition: transform 0.3s; }
        .pose-img:hover { transform: scale(1.02); }
        .back-btn { color: #fff; text-decoration: none; font-size: 0.9rem; }
        .back-btn:hover { color: #f1c40f; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">ITS_CAPTURED</div>
        <div>
            <a href="/dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="text-center mb-5">
            <h1 id="workspace-title">Loading Workspace...</h1>
            <p class="text-muted">AI-Curated Suggestions & Rules</p>
        </div>

        <div class="row">
            <!-- Left Column: Lighting & Camera Rules -->
            <div class="col-md-6">
                <h3 class="section-title"><i class="fas fa-lightbulb"></i> Lighting & Settings</h3>
                <div id="rules-container">
                    <p>Loading rules...</p>
                </div>
            </div>

            <!-- Right Column: Poses Gallery -->
            <div class="col-md-6">
                <h3 class="section-title"><i class="fas fa-camera-retro"></i> Suggested Poses</h3>
                <div class="row" id="poses-container">
                    <p>Loading poses...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
