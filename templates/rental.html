            height: 600px;
            border-radius: 15px;

            border: 2px solid #667eea;

            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .rental-item:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
            border-left-color: #764ba2;
        }

            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #667eea;
            color: #fff;
        }

        .rental-details.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            margin-bottom: 12px;

            align-items: flex-start;
            gap: 10px;

            color: #667eea;
            min-width: 20px;

            font-weight: 600;

            font-size: 0.9em;

            border-radius: 5px;

            text-decoration: none;
            font-weight: 600;

            margin-right: 8px;
        }

        let currentMarkers = {};
        let currentShop = null;

        // Initialize Map
        const map = L.map('rental-map').setView([19.0760, 72.8777], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Custom marker icon
        const shopIcon = L.divIcon({
            html: '<div style="background-color: #667eea; color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 3px solid #764ba2; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"><i class="fas fa-camera"></i></div>',
            iconSize: [32, 32],
            className: 'custom-marker'
        });

        // Add markers and populate list
        function addShop(shop) {
            const marker = L.marker([shop.lat, shop.lng], { icon: shopIcon })
                .bindPopup(`
                    <div class="popup-title">${shop.name}</div>
                    <div class="popup-info"><strong>Location:</strong> ${shop.area}</div>
                    <div class="popup-info"><strong>Phone:</strong> ${shop.phone}</div>
                    <div class="popup-info"><strong>Rating:</strong> <span style="color: #ffd700;">★ ${shop.rating}</span></div>
                `)
                .addTo(map);

            currentMarkers[shop.id] = marker;

            const listItem = document.createElement('li');
            listItem.className = 'rental-item';
            listItem.innerHTML = `
                <div class="rental-item-name">${shop.name}</div>
                <div class="rental-item-area">${shop.area}</div>
                <div class="rental-item-rating">★ ${shop.rating}/5</div>
            `;

            listItem.addEventListener('click', () => selectShop(shop));
            document.getElementById('rental-list').appendChild(listItem);
        }

        // Select shop function
        function selectShop(shop) {
            currentShop = shop;

            // Update active state in list
            document.querySelectorAll('.rental-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.rental-item').classList.add('active');

            // Show details
            const detailsDiv = document.getElementById('rental-details');
            document.getElementById('detail-name').textContent = shop.name;
            document.getElementById('detail-content').innerHTML = `
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-location-dot"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Address</span>
                        <div class="detail-value">${shop.address}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-phone"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Phone</span>
                        <div class="detail-value">${shop.phone}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-envelope"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Email</span>
                        <div class="detail-value">${shop.email}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-clock"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Hours</span>
                        <div class="detail-value">${shop.hours}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-video"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Equipment Available</span>
                        <div class="detail-value">${shop.equipment}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-star"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Rating</span>
                        <div class="detail-value" style="color: #ffd700;">★ ${shop.rating}/5</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon"><i class="fas fa-globe"></i></div>
                    <div class="detail-text">
                        <span class="detail-label">Website</span>
                        <div class="detail-value"><a href="https://${shop.website}" target="_blank" style="color: #667eea; text-decoration: none;">${shop.website}</a></div>
                    </div>
                </div>
            `;
            detailsDiv.classList.add('show');

            // Animate map to shop
            map.flyTo([shop.lat, shop.lng], 14);
            setTimeout(() => {
                currentMarkers[shop.id].openPopup();
            }, 500);
        }

        // Initialize all shops
        rentalShops.forEach(shop => addShop(shop));

        // Search functionality
        document.getElementById('search-rental').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.rental-item');
            
            items.forEach((item, index) => {
                const shop = rentalShops[index];
                if (shop.name.toLowerCase().includes(searchTerm) || 
                    shop.area.toLowerCase().includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
