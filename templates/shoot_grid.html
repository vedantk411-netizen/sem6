<div class="shoot-grid" id="shoot-grid">
    {% for type in shoot_types %}
    <div class="shoot-card shoot-type-card" data-type="{{ type.name | lower }}" onclick="selectShootType('{{ type.name }}')">
        <i class="{{ type.icon }}"></i>
        <h3>{{ type.name }}</h3>
        <p>{{ type.description }}</p>
    </div>
    {% endfor %}
</div>
