        }

            left: 0;
            right: 0;
            bottom: 0;

            justify-content: center;
            font-size: 3em;

            const grid = document.getElementById('places-grid');
            grid.innerHTML = '';

            let spots = photographySpots.filter(spot => spot.city === city);

            if (searchTerm) {
                spots = spots.filter(spot => 
                    spot.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    spot.area.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    spot.type.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (spots.length === 0) {
                grid.innerHTML = '<div class="no-results" style="grid-column: 1/-1;">No photography spots found. Try a different search!</div>';
                return;
            }

            spots.forEach(spot => {
                const card = document.createElement('div');
                card.className = 'place-card active';

                // Prefer explicit `spot.image`; otherwise use Unsplash Source (free, no API key)
                let imgSrc = '';
                if (spot.image) {
                    imgSrc = spot.image;
                } else {
                    // Build a keyword query using place name and area to get a relevant image
                    const query = encodeURIComponent(`${spot.name}, ${spot.area}, photography`);
                    imgSrc = `https://source.unsplash.com/800x600/?${query}`;
                }

                card.innerHTML = `
                    <div class="place-image">
                        <img src="${imgSrc}" alt="${spot.name}" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&h=300&fit=crop'">
                        <div class="place-image-overlay">${spot.icon}</div>
                    </div>
                    <div class="place-content">
                        <div class="place-title">${spot.name}</div>
                        <div class="place-city"><i class="fas fa-map-marker"></i> ${spot.area}</div>
                        <div class="place-description">${spot.description}</div>
                        <div class="place-details">
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-clock"></i> Best Time</div>
                                <div class="detail-value">${spot.bestTime}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-signal"></i> Difficulty</div>
                                <div class="detail-value">${spot.difficulty}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-location-dot"></i> Distance</div>
                                <div class="detail-value">${spot.distanceFromCenter}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label"><i class="fas fa-parking"></i> Parking</div>
                                <div class="detail-value">${spot.parking}</div>
                            </div>
                        </div>
                        <div class="place-tags">
                            ${spot.type.split(', ').map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // City tab switching
        document.querySelectorAll('.city-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.city-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCity = tab.dataset.city;
                renderPlaces(currentCity);
            });
        });

        // Search functionality
        document.getElementById('search-places').addEventListener('input', (e) => {
            renderPlaces(currentCity, e.target.value);
        });

        // Initial render
        renderPlaces('mumbai');
    </script>
</body>
</html>
